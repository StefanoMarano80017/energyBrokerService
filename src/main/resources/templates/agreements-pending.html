<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pending agreements')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="mb-4">Pending agreements <small class="text-muted fs-5">(PROPOSED)</small></h1>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Id</th>
            <th>CPO</th>
            <th>eMSP</th>
            <th>Tariff</th>
            <th>Created at</th>
            <th class="text-end">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${agreements}">
            <td th:text="${a.id()}">id</td>
            <td th:with="cpo=${cpoById.get(a.cpoId())}">
                <th:block th:replace="~{fragments/layout :: entityRef(${cpo}, ${a.cpoId()})}"></th:block>
            </td>
            <td th:with="emsp=${emspById.get(a.emspId())}">
                <th:block th:replace="~{fragments/layout :: entityRef(${emsp}, ${a.emspId()})}"></th:block>
            </td>
            <td th:text="${a.tariff().type()} + ' &middot; ' + ${a.tariff().pricePerKwh()} + ' &euro;/kWh'">tariff</td>
            <td th:text="${a.createdAt()}">createdAt</td>
            <td class="text-end text-nowrap">
                <form th:action="@{'/ui/agreements/' + ${a.id()} + '/accept'}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-success">Accept</button>
                </form>
                <form th:action="@{'/ui/agreements/' + ${a.id()} + '/reject'}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Reject</button>
                </form>
            </td>
        </tr>
        <tr th:if="${agreements.isEmpty()}">
            <td colspan="6" class="text-center text-muted">No pending agreement</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
