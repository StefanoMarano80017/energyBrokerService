<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Energy Broker Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/ui">⚡ Energy Broker Console</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/ui">Dashboard</a>
            <a class="nav-link" href="/ui/cpos">CPO</a>
            <a class="nav-link" href="/ui/emsps">eMSP</a>
            <a class="nav-link" href="/ui/agreements">Agreements</a>
            <a class="nav-link" href="/ui/agreements/pending">Pending</a>
            <a class="nav-link" href="/ui/cpo/agreements">CPO · Propose</a>
            <a class="nav-link" href="/ui/emsp/agreements">eMSP · Accept</a>
        </div>
    </div>
</nav>

<!--
  Riferimento a un CPO/eMSP: nome + identificativo esterno (se presente) + identificativo
  interno. Usato dalle pagine accordi, dove il dato disponibile è il solo UUID.
-->
<th:block th:fragment="entityRef(entity, rawId)">
    <span th:if="${entity != null}">
        <span th:text="${entity.name()}">name</span>
        <span class="badge text-bg-light border" th:if="${entity.externalId() != null}"
              th:text="'ext: ' + ${entity.externalId()}">ext</span>
        <br/>
        <small class="text-muted" th:text="${rawId}">uuid</small>
    </span>
    <span th:if="${entity == null}" class="text-muted" th:text="${rawId}">uuid</span>
</th:block>

</body>
</html>
