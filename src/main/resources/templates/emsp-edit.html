<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit eMSP')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="mb-4">Edit eMSP</h1>

    <form th:action="@{'/ui/emsps/' + ${emsp.id()} + '/update'}" method="post" class="col-md-6">
        <div class="mb-3">
            <label class="form-label">Id</label>
            <input type="text" class="form-control" th:value="${emsp.id()}" disabled/>
            <div class="form-text">Identificativo interno all'Energy Broker, non modificabile.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">External Id</label>
            <input type="text" name="externalId" class="form-control"
                   th:value="${emsp.externalId()}" placeholder="EMSP-001"/>
            <div class="form-text">Identificativo assegnato dal sistema esterno. Opzionale, univoco.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" th:value="${emsp.name()}" required/>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/ui/emsps" class="btn btn-link">Cancel</a>
    </form>
</div>
</body>
</html>
