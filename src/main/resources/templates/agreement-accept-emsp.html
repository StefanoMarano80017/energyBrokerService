<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('eMSP — Accettazione accordo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="mb-1">eMSP — Accettazione accordo</h1>
    <p class="text-muted mb-4">
        Attore corrente: <strong>eMSP</strong> (destinatario). Sono elencati gli accordi in stato
        <span class="badge text-bg-warning">PROPOSED</span> ricevuti dai CPO; le proposte si creano
        dalla pagina <a href="/ui/cpo/agreements">CPO — Proposta accordo</a>.
    </p>

    <form th:action="@{/ui/emsp/agreements}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-md-5">
            <label class="form-label">eMSP (recipient)</label>
            <select name="emspId" class="form-select" onchange="this.form.submit()">
                <option value="">— all eMSP —</option>
                <option th:each="emsp : ${emsps}"
                        th:value="${emsp.id()}"
                        th:selected="${emsp.id() == selectedEmspId}"
                        th:text="${emsp.name()} + (${emsp.externalId()} != null ? ' · ext: ' + ${emsp.externalId()} : '')">emsp</option>
            </select>
        </div>
    </form>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Id</th>
            <th>CPO (proposing)</th>
            <th>Tariff</th>
            <th>Created at</th>
            <th class="text-end">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${agreements}">
            <td><small class="text-muted" th:text="${a.id()}">id</small></td>
            <td th:with="cpo=${cpoById.get(a.cpoId())}">
                <th:block th:replace="~{fragments/layout :: entityRef(${cpo}, ${a.cpoId()})}"></th:block>
            </td>
            <td th:text="${a.tariff().type()} + ' &middot; ' + ${a.tariff().pricePerKwh()} + ' &euro;/kWh'">tariff</td>
            <td th:text="${a.createdAt()}">createdAt</td>
            <td class="text-end text-nowrap">
                <form th:action="@{'/ui/emsp/agreements/' + ${a.id()} + '/accept'}" method="post"
                      class="d-inline">
                    <input type="hidden" name="emspId" th:value="${selectedEmspId}"
                           th:if="${selectedEmspId != null}"/>
                    <button type="submit" class="btn btn-sm btn-success">Accept</button>
                </form>
                <form th:action="@{'/ui/emsp/agreements/' + ${a.id()} + '/reject'}" method="post"
                      class="d-inline">
                    <input type="hidden" name="emspId" th:value="${selectedEmspId}"
                           th:if="${selectedEmspId != null}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">Reject</button>
                </form>
            </td>
        </tr>
        <tr th:if="${agreements.isEmpty()}">
            <td colspan="5" class="text-center text-muted">No proposed agreement</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
