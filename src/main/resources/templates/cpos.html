<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('CPO')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="mb-4">Charge Point Operators</h1>

    <div class="card mb-4">
        <div class="card-header">New CPO</div>
        <div class="card-body">
            <form th:action="@{/ui/cpos}" method="post" class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" required/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Latitude</label>
                    <input type="number" step="any" name="latitude" class="form-control" required/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Longitude</label>
                    <input type="number" step="any" name="longitude" class="form-control" required/>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Latitude</th>
            <th>Longitude</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cpo : ${cpos}">
            <td th:text="${cpo.id()}">id</td>
            <td th:text="${cpo.name()}">name</td>
            <td th:text="${cpo.latitude()}">lat</td>
            <td th:text="${cpo.longitude()}">lon</td>
            <td class="text-end">
                <a th:href="@{'/ui/cpos/' + ${cpo.id()} + '/edit'}"
                   class="btn btn-sm btn-outline-secondary">Edit</a>
                <form th:action="@{'/ui/cpos/' + ${cpo.id()} + '/delete'}" method="post"
                      class="d-inline"
                      onsubmit="return confirm('Delete this CPO?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${cpos.isEmpty()}">
            <td colspan="5" class="text-center text-muted">No CPO yet</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
